name: Issue 4 E2E patch

on:
  push:
    branches:
      - fix/quick-refresh-unmet-prerequisite

permissions:
  contents: write

jobs:
  patch-e2e:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/quick-refresh-unmet-prerequisite
          fetch-depth: 0

      - name: Update stale Quick Refresh journey target
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/e2e_mathfan.py')
          text = path.read_text()
          start = text.index('def grade4_readiness_bridge_lesson_review(page: Page) -> None:')
          end = text.find('\ndef ', start + 1)
          if end == -1:
              end = len(text)
          before = text[:start]
          section = text[start:end]
          after = text[end:]

          lines = section.splitlines(keepends=True)
          changed_tile = 0
          changed_dialog = 0
          for index, line in enumerate(lines):
              if 'get_by_role("button"' in line and 'Factors as Rectangle Sides:' in line:
                  lines[index] = line.replace('Factors as Rectangle Sides', 'Find Every Factor Pair')
                  changed_tile += 1
              elif 'get_by_role("dialog"' in line and 'Factors as Rectangle Sides' in line:
                  lines[index] = line.replace('Factors as Rectangle Sides', 'Find Every Factor Pair')
                  changed_dialog += 1
          assert changed_tile == 1, f'Expected one stale tile selector in journey, changed {changed_tile}'
          assert changed_dialog == 1, f'Expected one stale dialog selector in journey, changed {changed_dialog}'
          path.write_text(before + ''.join(lines) + after)
          PY

      - name: Commit E2E correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/e2e_mathfan.py
          git diff --cached --check
          git commit -m "Align Grade 4 bridge E2E with unmet prerequisite"
          git push origin HEAD:fix/quick-refresh-unmet-prerequisite
